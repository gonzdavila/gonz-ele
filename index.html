<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Our Home">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icono.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Our Home</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6a66;--soft:#8c8a84;--line:#e6e4de;--track:#ecebe6;
--pos:#1f7a4d;--neg:#b3261e;--acc:#2f5d8a;--acc-bg:#e8eff7;--warn:#fff4e5;--warn-ink:#7a4b00;--ok-bg:#e9f5ee;--bad-bg:#fbeceb;
--c-plan:#2f5d8a;--c-ritmo:#c58b2a;--c-viaje:#7b61a8;--c-multa:#b3261e;--c-reemb:#3c9a8f;--c-anual:#c58b2a;--c-msi:#8a8a84;--c-fijo:#cfcdc6;--grid:#ecebe6}
@media (prefers-color-scheme:dark){:root{--bg:#151514;--card:#1f1f1d;--ink:#ecebe6;--mute:#a09e97;--soft:#8c8a84;--line:#33322f;--track:#2b2a27;
--pos:#5cc48f;--neg:#ff8a80;--acc:#8fb6e0;--acc-bg:#1d2a38;--warn:#2d2416;--warn-ink:#f2c46d;--ok-bg:#16291f;--bad-bg:#331b19;
--c-plan:#5b8fd0;--c-ritmo:#d9a441;--c-fijo:#4a4945;--grid:#2b2a27}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mute{color:var(--mute)}
#candado{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lock{width:100%;max-width:360px;text-align:center}
.lock .ico{width:56px;height:56px;border-radius:16px;background:var(--acc);margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.lock h1{font-size:22px;margin:0 0 4px}.lock p{color:var(--mute);margin:0 0 20px;font-size:14px}
.lock input[type=password]{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:17px}
.lock label{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0;font-size:14px;color:var(--mute)}
.btn{height:48px;width:100%;border-radius:12px;border:0;background:var(--acc);color:#fff;font-weight:600;font-size:16px;cursor:pointer}
@media (prefers-color-scheme:dark){.btn{color:#10202f}}
.err{color:var(--neg);font-size:14px;min-height:20px;margin-top:10px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid transparent}
header.top.sombra{border-bottom-color:var(--line)}
.eyebrow{margin:0;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
header h1{margin:2px 0 0;font-size:24px;letter-spacing:-.01em}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:13px;color:var(--mute);cursor:pointer}
main{max-width:760px;margin:0 auto;padding:4px 16px calc(96px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;max-width:160px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11px;color:var(--soft);cursor:pointer}
nav.tabs button[aria-current=page]{color:var(--acc)}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:16px 0 6px;color:var(--mute);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card>p:last-child{margin-bottom:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 4px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.tile .k{font-size:12px;color:var(--mute)}.tile .v{font-size:22px;font-weight:650;margin:2px 0;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .v small{font-size:12px;color:var(--mute);font-weight:400}.tile .s{font-size:12px;color:var(--mute)}
.alerta{background:var(--warn);border-color:transparent;color:var(--warn-ink)}.alerta h2,.alerta h3{color:var(--warn-ink)}
.alerta p{font-size:16px;margin:0}.alerta ul{margin:6px 0 0;padding-left:18px}
.aviso{background:var(--acc-bg);border-color:transparent}
.carta p{margin:0 0 10px}.carta ul{margin:0 0 10px;padding-left:18px}
ul.lista{list-style:none;margin:0;padding:0}
ul.lista li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
ul.lista li:first-child{border-top:0}
ul.lista small{display:block;color:var(--mute);font-size:12px}
ul.lista .m{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.pago .d{min-width:46px;color:var(--mute);font-variant-numeric:tabular-nums}.pago .c{flex:1}
.pago.hecho{opacity:.45}.pago.ingreso .m{color:var(--pos)}
.bar{position:relative;height:7px;background:var(--track);border-radius:4px;margin-top:6px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--c-plan)}
.bar i.over{background:var(--neg)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5;border-radius:1px}
.cat{border-top:1px solid var(--line)}.cat:first-of-type{border-top:0}
.cat summary{list-style:none;display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:10px 0;cursor:pointer}
.cat summary::-webkit-details-marker{display:none}
.cat .cn small,.cat .cv small{display:block;font-size:12px;color:var(--mute);font-weight:400}
.cat .cv{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.cat .bar{grid-column:1/3}
.cat .det{padding:0 0 12px;font-size:13px;color:var(--mute)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){.chip[aria-pressed=true]{color:#10202f}}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--track);margin:4px 0 10px}
.stack span{height:100%}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.leyenda{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin:2px 0 6px}
.leyenda span{display:flex;align-items:center}.leyenda i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.leyenda i.linea{height:0;width:16px;border-top:2px dashed var(--soft);border-radius:0}
svg.graf{width:100%;height:auto;display:block;overflow:visible}
svg.graf text{font-size:10px;fill:var(--soft);font-family:inherit}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:8px 4px;border-top:1px solid var(--line);text-align:right;vertical-align:top}
table.t th{font-size:12px;color:var(--mute);font-weight:500;border-top:0}
table.t td:first-child,table.t th:first-child{text-align:left}
table.t small{display:block;font-size:11px;color:var(--mute)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.kv span{color:var(--mute)}.kv b{text-align:right;font-variant-numeric:tabular-nums}
.campo{display:block;margin:10px 0}
.campo>span{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:4px}
.campo>span b{color:var(--ink);font-variant-numeric:tabular-nums}
.campo input[type=number],.campo select{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px;font-size:16px}
.campo input[type=range]{width:100%;accent-color:var(--acc)}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.veredicto{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.veredicto.ok{background:var(--ok-bg);color:var(--pos)}.veredicto.mal{background:var(--bad-bg);color:var(--neg)}.veredicto.ojo{background:var(--warn);color:var(--warn-ink)}
.prog{height:10px;border-radius:5px;background:var(--track);overflow:hidden;display:flex;margin:6px 0}
.prog span{height:100%}
details.leccion{border-top:1px solid var(--line)}details.leccion:first-of-type{border-top:0}
details.leccion>summary{list-style:none;cursor:pointer;padding:12px 0;display:flex;gap:12px;align-items:flex-start}
details.leccion>summary::-webkit-details-marker{display:none}
details.leccion>summary .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--acc-bg);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:650;font-size:14px}
details.leccion>summary b{display:block}details.leccion>summary small{color:var(--mute);font-size:13px}
details.leccion[open]>summary .n{background:var(--acc);color:#fff}
.leccion .cuerpo{padding:0 0 14px 40px;font-size:14px}
.leccion .cuerpo p{margin:0 0 10px}
.paso{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.paso:first-child{border-top:0}
.estado{flex:none;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;margin-top:1px}
.estado.ok{background:var(--ok-bg);color:var(--pos)}.estado.no{background:var(--bad-bg);color:var(--neg)}.estado.prox{background:var(--track);color:var(--mute)}
.pie{font-size:12px;color:var(--mute);margin:16px 4px}
.hint{font-size:12px;color:var(--mute);margin:8px 0 0}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

<section id="candado">
  <form class="lock" id="formCandado" autocomplete="on">
    <div class="ico"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></div>
    <h1>Our Home</h1>
    <p>Datos cifrados al 2026-11-09. Escribe la contraseña para abrir.</p>
    <input type="text" name="username" value="casa" autocomplete="username" hidden>
    <input type="password" id="frase" autocomplete="current-password" placeholder="Contraseña" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <label><input type="checkbox" id="recordar" checked> Recordar en este dispositivo</label>
    <button class="btn" id="abrir" type="submit">Abrir</button>
    <div class="err" id="errCandado" role="alert"></div>
  </form>
</section>

const CLAVE_LS = "hub-llave-" + CIF.salt;
let D = null, TAB = "hoy", MES_SEL = null;

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const mx = (v, signo) => { const r = Math.round(v); return (r < 0 ? "−\u2060" : (signo && r > 0 ? "+" : "")) + "$" + Math.abs(r).toLocaleString("es-MX"); };
const mk = v => { const r = Math.round(v / 1000); return (r < 0 ? "−\u2060" : "") + "$" + Math.abs(r).toLocaleString("es-MX") + "k"; };
const pct = v => Math.round(v * 100) + "%";
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const fechaCorta = iso => { const [y, m, d] = iso.split("-"); return +d + " " + MESES[+m - 1]; };
const hoyISO = () => { const t = new Date(); return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0"); };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const aB64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const norm = s => s.normalize("NFC").trim().toLowerCase().replace(/\s+/g, " ");
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
             set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
             del(k) { try { localStorage.removeItem(k); } catch (e) {} } };

/* ---------- cifrado ---------- */
async function llaveDeFrase(frase) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm(frase)), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(CIF.salt), iterations: CIF.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function descifrar(llave) {
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(CIF.iv) }, llave, b64(CIF.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
function montar(paquete) {
  D = paquete.datos;
  if ($("#app")) return;          // ya está montada: solo se actualizan los datos
  $("#raiz").innerHTML = paquete.html;
  const s = document.createElement("script");
  s.textContent = paquete.js;
  document.body.appendChild(s);
}
async function intentarGuardada() {
  const g = ls.get(CLAVE_LS);
  if (!g) return false;
  try {
    const llave = await crypto.subtle.importKey("raw", b64(g), { name: "AES-GCM" }, false, ["decrypt"]);
    montar(await descifrar(llave)); return true;
  } catch (e) { ls.del(CLAVE_LS); return false; }
}
$("#formCandado").addEventListener("submit", async ev => {
  ev.preventDefault();
  const err = $("#errCandado"), btn = $("#abrir"), f = $("#frase").value;
  err.textContent = "";
  if (!norm(f)) { err.textContent = "Escribe la contraseña."; return; }
  if (!window.crypto || !crypto.subtle) { err.textContent = "Este navegador no puede abrir la página. Usa Safari o Chrome."; return; }
  btn.disabled = true; btn.textContent = "Abriendo…";
  try {
    const llave = await llaveDeFrase(f);
    montar(await descifrar(llave));
    if ($("#recordar").checked) ls.set(CLAVE_LS, aB64(await crypto.subtle.exportKey("raw", llave)));
    $("#frase").value = "";
    entrar();
  } catch (e) {
    err.textContent = "Esa contraseña no abre la página. Revisa que esté completa.";
  } finally { btn.disabled = false; btn.textContent = "Abrir"; }
});

/* ---------- arranque ---------- */
(async () => { if (window.crypto && crypto.subtle && await intentarGuardada()) entrar(); else $("#frase").focus(); })();
</script>
