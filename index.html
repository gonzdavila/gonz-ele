*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}.pos{color:var(--pos)}.neg{color:var(--neg)}.mute{color:var(--mute)}
#candado{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lock{width:100%;max-width:360px;text-align:center}
.lock .ico{width:64px;height:64px;border-radius:20px;background:var(--hero);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(91,92,240,.35)}

.lock input[type=password]{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:17px}
.lock label{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0;font-size:14px;color:var(--mute)}
.btn{height:50px;width:100%;border-radius:14px;border:0;background:var(--hero);color:#fff;font-weight:650;font-size:16px;cursor:pointer}
.err{color:var(--neg);font-size:14px;min-height:20px;margin-top:10px}

const CLAVE_LS = "hub-llave-" + CIF.salt;
let D = null, TAB = "hoy", MES_SEL = null;

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const mx = (v, signo) => { const r = Math.round(v); return (r < 0 ? "−⁠" : (signo && r > 0 ? "+" : "")) + "$" + Math.abs(r).toLocaleString("es-MX"); };
const mk = v => { const r = Math.round(v / 1000); return (r < 0 ? "−⁠" : "") + "$" + Math.abs(r).toLocaleString("es-MX") + "k"; };
const pct = v => Math.round(v * 100) + "%";
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const fechaCorta = iso => { const [y, m, d] = iso.split("-"); return +d + " " + MESES[+m - 1]; };
const hoyISO = () => { const t = new Date(); return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0"); };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const aB64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const norm = s => s.normalize("NFC").trim().toLowerCase().replace(/\s+/g, " ");
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
             set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
             del(k) { try { localStorage.removeItem(k); } catch (e) {} } };

/* ---------- tema claro / oscuro ---------- */
function aplicarTema(t) {
  const r = document.documentElement;
  if (t === "claro") r.dataset.theme = "light"; else if (t === "oscuro") r.dataset.theme = "dark"; else delete r.dataset.theme;
  const oscuro = t === "oscuro" || (t !== "claro" && matchMedia("(prefers-color-scheme: dark)").matches);
  $("#metaTema").setAttribute("content", oscuro ? "#0e1120" : "#f3f4fa");
}
aplicarTema(ls.get("hub-tema"));

/* ---------- cifrado ---------- */
async function llaveDeFrase(frase) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm(frase)), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(CIF.salt), iterations: CIF.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function descifrar(llave) {
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(CIF.iv) }, llave, b64(CIF.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
function montar(paquete) {
  D = paquete.datos;
  if ($("#app")) return;          // ya está montada: solo se actualizan los datos
  $("#raiz").innerHTML = paquete.html;
  const s = document.createElement("script");
  s.textContent = paquete.js;
  document.body.appendChild(s);
}
async function intentarGuardada() {
  const g = ls.get(CLAVE_LS);
  if (!g) return false;
  try {
    const llave = await crypto.subtle.importKey("raw", b64(g), { name: "AES-GCM" }, false, ["decrypt"]);
    montar(await descifrar(llave)); return true;
  } catch (e) { ls.del(CLAVE_LS); return false; }
}
$("#formCandado").addEventListener("submit", async ev => {
  ev.preventDefault();
  const err = $("#errCandado"), btn = $("#abrir"), f = $("#frase").value;
  err.textContent = "";
  if (!norm(f)) { err.textContent = "Escribe la contraseña."; return; }
  if (!window.crypto || !crypto.subtle) { err.textContent = "Este navegador no puede abrir la página. Usa Safari o Chrome."; return; }
  btn.disabled = true; btn.textContent = "Abriendo…";
  try {
    const llave = await llaveDeFrase(f);
    montar(await descifrar(llave));
    if ($("#recordar").checked) ls.set(CLAVE_LS, aB64(await crypto.subtle.exportKey("raw", llave)));
    $("#frase").value = "";
    entrar();
  } catch (e) {
    err.textContent = "Esa contraseña no abre la página. Revisa que esté completa.";
  } finally { btn.disabled = false; btn.textContent = "Abrir"; }
});

/* ---------- arranque ---------- */
(async () => { if (window.crypto && crypto.subtle && await intentarGuardada()) entrar(); else $("#frase").focus(); })();
</script>
